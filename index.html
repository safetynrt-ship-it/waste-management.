<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แบบฟอร์มการขอทิ้งประเภทขยะ</title>
    <style>
        body {font-family: Tahoma, sans-serif; background:#f4f6f8;}
        .container {max-width:600px; margin:40px auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);}        
        h2 {color:#2e7d32; text-align:center;}
        label {display:block; margin-top:15px; font-weight:bold;}
        input, select, textarea {width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;}
        button {margin-top:20px; width:100%; padding:12px; background:#2e7d32; color:#fff; border:none; border-radius:6px; font-size:16px; cursor:pointer;}
        button:hover {background:#1b5e20;}
    </style>
</head>
<body>
<div class="container">
    <h2>แบบฟอร์มการขอทิ้งประเภทขยะ</h2>
    <form>
        <label>ชื่อ – นามสกุล</label>
        <input type="text" required>

        <label>แผนก / หน่วยงาน</label>
        <input type="text" required>

        <label>วันที่ขอทิ้งขยะ</label>
        <input type="date" required>

        <label>สถานที่ทิ้งขยะ</label>
        <input type="text" required>

        <label>ประเภทขยะ</label>
        <select required>
            <option value="">-- เลือกประเภทขยะ --</option>
            <option>ขยะทั่วไป</option>
            <option>ขยะรีไซเคิล</option>
            <option>ขยะอันตราย</option>
            <option>ขยะติดเชื้อ</option>
            <option>เศษวัสดุจากการผลิต</option>
        </select>

        <label>รายละเอียดขยะ / ปริมาณ</label>
        <textarea rows="3"></textarea>

        <label>มีสารเคมีหรือไม่</label>
        <select>
            <option>ไม่มี</option>
            <option>มี</option>
        </select>

        <label>แนบรูปภาพขยะ</label>
        <input type="file">

        <label>หมายเหตุเพิ่มเติม</label>
        <textarea rows="2"></textarea>

        <button type="submit">ส่งคำขอทิ้งขยะ</button>
    </form>
</div>
</body>
</html>
